services:
  postgres:
    image: postgres:16
    container_name: product-explorer-db
    environment:
      POSTGRES_DB: product_explorer
      POSTGRES_USER: product_explorer
      POSTGRES_PASSWORD: product_explorer
    ports:
      - "5432:5432"
    volumes:
      - product_explorer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_explorer -d product_explorer"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  product_explorer_pgdata:
